<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undercroft</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0d; overflow: hidden; height: 100%; }
  #game-root { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas { background: #111; image-rendering: pixelated; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
  #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  #console {
    position: absolute; bottom: 0; left: 0; width: 100%; max-height: 40%;
    background: rgba(0,0,0,0.85); color: #9f9; font-family: monospace; font-size: 13px;
    display: none; flex-direction: column; pointer-events: auto;
  }
  #console.open { display: flex; }
  #console-log { overflow-y: auto; padding: 4px 8px; flex: 1; }
  #console-input {
    background: #111; color: #cfc; border: none; border-top: 1px solid #333;
    font-family: monospace; font-size: 13px; padding: 4px 8px; outline: none;
  }
</style>
</head>
<body>
  <div id="game-root">
    <canvas id="game" width="1040" height="720"></canvas>
    <div id="hud"></div>
    <div id="console">
      <div id="console-log"></div>
      <input id="console-input" type="text" spellcheck="false" placeholder="command...">
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
